name: build

# main에 합쳐지는 코드가 최소 지원 버전(JDK 17)에서 컴파일되는지 확인한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          find src -name '*.java' > bin/sources.txt
          javac --release 17 -encoding UTF-8 -d bin @bin/sources.txt
